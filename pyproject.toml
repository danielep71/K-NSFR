# Quality gates for every Python tool and test.

[tool.ruff]
target-version = "py313"
# Formatting target only: E501 is not selected and CI does not run ruff format.
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.mypy]
python_version = "3.13"
files = ["tools"]
pretty = true
show_error_codes = true
warn_unused_configs = true
# Every module, tests included, is held to the full strict bundle.
strict = true
