name: Probe default token
# Temporary enforcement probe for #15: no permissions are declared, so the job
# setup log shows the repository's default GITHUB_TOKEN permissions. Removed by
# the next commit.
on:
  pull_request:
    branches: ["release/**"]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "Default token permissions are listed in the Set up job log."
