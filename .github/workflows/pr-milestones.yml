name: Keep milestones issue-only

on:
  push:
    branches: [main]
    paths: [.github/workflows/pr-milestones.yml]
  pull_request_target:
    types: [opened, reopened, edited, milestoned]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # One queue per pull request for its own events, so an event for one PR never
  # replaces a pending event for another; full scans (schedule, push, dispatch)
  # share one serialized queue of their own. Nothing is cancelled.
  group: pr-milestones-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || 'scan' }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Remove PR milestone assignments
    # PR events and the schedule always run the trusted copy of this workflow;
    # a manual dispatch or push runs only from the default branch.
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'schedule' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      # Trusted inline code only: never check out or execute a PR's contents.
      - name: Reconcile PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          def cell(text):
              """A table cell: the title is data, never markup or a new row."""
              text = str(text).replace("\\", "\\\\").replace("|", "\\|")
              return " ".join(text.splitlines())

          def summary(removed):
              lines = ["## PR milestone reconciliation", ""]
              if not removed:
                  return "\n".join(lines + ["No pull request had a milestone.", ""])
              lines += ["| Pull request | Removed milestone |", "| --- | --- |"]
              lines += [f"| #{number} | {cell(title)} |" for number, title in removed]
              return "\n".join(lines + [""])

          def reconcile(request, repository, event):
              """Clear PR milestones; return (number, title) for each one removed."""
              removed = []

              def clear(number):
                  # Verify the live object before mutating the issues endpoint.
                  item = request("GET", f"/repos/{repository}/issues/{number}")
                  if "pull_request" not in item:
                      raise ValueError("Refusing to change an issue")
                  if item.get("milestone") is not None:
                      result = request("PATCH", f"/repos/{repository}/issues/{number}", {"milestone": None})
                      if result.get("milestone") is not None:
                          raise ValueError(f"PR #{number} still has a milestone")
                      # Confirm persisted state independently of the PATCH response.
                      current = request("GET", f"/repos/{repository}/issues/{number}")
                      if current.get("milestone") is not None:
                          raise ValueError(f"PR #{number} still has a milestone after read-back")
                      removed.append((number, item["milestone"].get("title", "")))
                      print(f"Removed milestone from PR #{number}")

              if "pull_request" in event:
                  clear(int(event["number"]))
                  return removed
              # Traverse the full unfiltered PR collection so mutations cannot
              # shift pagination. This includes closed and merged PRs and bots.
              for page in range(1, 101):
                  items = request("GET", f"/repos/{repository}/pulls?state=all&sort=created&direction=asc&per_page=100&page={page}")
                  if not isinstance(items, list):
                      raise ValueError("Malformed PR collection")
                  for item in items:
                      if item.get("milestone") is not None:
                          clear(int(item["number"]))
                  if len(items) < 100:
                      print("PR milestone reconciliation complete")
                      return removed
              raise ValueError("PR pagination exceeded 100 pages")

          def main():
              repository = os.environ["GITHUB_REPOSITORY"]
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())

              def request(method, path, data=None):
                  headers = {
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  }
                  payload = None if data is None else json.dumps(data).encode()
                  req = Request(os.environ["GITHUB_API_URL"] + path, data=payload, headers=headers, method=method)
                  with urlopen(req, timeout=30) as response:
                      return json.load(response)

              removed = reconcile(request, repository, event)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                  handle.write(summary(removed))

          if __name__ == "__main__":
              main()
          PY
