name: Repository integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify candidate commit
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          check-latest: false
      - name: Install hash-locked quality and content tools
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r tools/requirements-quality-ci.txt
      - name: Install checksum-verified actionlint
        run: |
          set -euo pipefail
          validator_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$validator_dir"
          archive="$validator_dir/actionlint.tar.gz"
          curl --fail --location --proto '=https' --retry 3 --show-error --silent \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$validator_dir" actionlint
          echo "$validator_dir" >> "$GITHUB_PATH"
      - name: Run all portable checks
        run: python tools/check.py --ci
      - name: Publish check summary
        if: always()
        run: |
          if [[ -f test-results/repository-integrity.md ]]; then
            cat test-results/repository-integrity.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced; inspect setup or execution failure." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-integrity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: error
          retention-days: 30
