name: Repository integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify candidate commit
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          check-latest: false
      - name: Install pinned YAML validator
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3
      - name: Validate committed Markdown and YAML
        run: |
          python tools/check_content.py
          python -m unittest discover -s tools -p 'test_check_content.py'
      - name: Validate Python source syntax
        run: python -m compileall -q tools
      - name: Validate workflow syntax and expressions
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --location --proto '=https' --retry 3 --show-error --silent \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --strict
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -no-color
      - name: Validate labels and reconciliation
        run: |
          node .github/scripts/labels-sync.mjs --self-test
          node .github/scripts/labels-sync.mjs --mode validate
          node .github/scripts/labels-drift.mjs --self-test
      - name: Validate issue forms and triage
        run: |
          python tools/check_issues.py --check-config
          python -m unittest discover -s tools -p 'test_check_issues.py'
      - name: Validate committed source conventions and checkout round trips
        run: |
          python tools/check_source_control.py --ref HEAD
          python -m unittest discover -s tools -p 'test_source_control.py'
