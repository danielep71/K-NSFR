name: Repository integrity
on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    name: Repository integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Validate labels and reconciliation
        run: |
          node .github/scripts/labels-sync.mjs --self-test
          node .github/scripts/labels-sync.mjs --mode validate
          node .github/scripts/labels-drift.mjs --self-test
      - name: Validate issue forms and triage
        run: |
          python tools/check_issues.py --check-config
          python -m unittest discover -s tools -p 'test_check_issues.py'
      - name: Validate committed source conventions and checkout round trips
        run: |
          python tools/check_source_control.py --ref HEAD
          python -m unittest discover -s tools -p 'test_source_control.py'
